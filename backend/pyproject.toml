[project]
name = "cti-warehouse-backend"
version = "0.1.0"
description = "CTI Warehouse backend: API, worker, and CLI"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
cti = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PLE", "PLW", "RUF"]
ignore = [
    "S101",  # assert is fine in tests (scoped below would be nicer, but tests use assert pervasively)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not e2e and not dataset\" --strict-markers"
markers = [
    "unit: no database or network",
    "integration: requires PostgreSQL via CTI_TEST_DATABASE_URL",
    "e2e: requires a running docker compose stack",
    "dataset: requires downloaded public datasets",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
