# flow_v1 plus allow-listed CICFlowMeter attributes (snake_case of the CSV headers). The list
# follows the published CIC-IDS2017 column names; verify against your copy. A listed attribute
# that is absent from every row fails training with a clear message; partly missing values are
# imputed (median) with a missing-indicator column.

name = "cicids2017_native_v1"
version = 1
extends = "flow_v1"
event_types = ["network_flow"]
attributes = [
  "flow_bytes_s", "flow_packets_s", "flow_iat_mean", "flow_iat_std", "flow_iat_max",
  "flow_iat_min", "fwd_packet_length_max", "fwd_packet_length_min", "fwd_packet_length_mean",
  "bwd_packet_length_max", "bwd_packet_length_min", "bwd_packet_length_mean",
  "packet_length_mean", "packet_length_std", "average_packet_size", "fin_flag_count",
  "syn_flag_count", "rst_flag_count", "psh_flag_count", "ack_flag_count",
  "init_win_bytes_forward", "init_win_bytes_backward", "active_mean", "idle_mean",
]
