# Canonical attack taxonomy (DATA_DICTIONARY.md §11.2). Loaded by `cti seed-reference`.
#
# `id` values are permanent: they are foreign keys in ground truth and (later) predictions.
# Never renumber or reuse an id; add new categories with new ids.
#
# `severity_weight` (0-1) feeds the Phase 5 risk score (ATTACK_CORRELATION.md §6). These are
# initial, judgement-based values to be reviewed in Phase 5; they are not measured quantities.

version = 1

